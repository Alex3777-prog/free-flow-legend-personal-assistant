[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "free-flow-personal-assistant"
version = "1.0.0"
description = "Command-line personal assistant for contacts and notes"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["rich>=13"]

[project.scripts]
personal-assistant = "assistant.main:main"

[tool.setuptools]
packages = ["assistant"]
